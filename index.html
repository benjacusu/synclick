<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Synclick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f1ed;
  --surface: #ffffff;
  --sidebar: #0f172a;
  --sidebar-hover: #1e293b;
  --sidebar-active: #e85d26;
  --accent: #e85d26;
  --accent-light: #fff2ed;
  --accent2: #0ea5e9;
  --text: #18181b;
  --text-2: #71717a;
  --text-3: #a1a1aa;
  --border: #e4e4e7;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --info: #0284c7;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.12);
  --sidebar-w: 220px;
  --font-head: 'Bricolage Grotesque', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; }
html, body { height: 100%; font-family: var(--font-body); background: var(--bg); color: var(--text); }
body { display: flex; overflow: hidden; }

/* ─── SIDEBAR ─── */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--sidebar); color: #e2e8f0;
  display: flex; flex-direction: column;
  height: 100vh; overflow-y: auto;
  position: relative; z-index: 100;
}
.sidebar-logo {
  padding: 16px 16px 12px;
  font-family: var(--font-head);
  font-size: 18px; font-weight: 800;
  color: #fff; letter-spacing: -0.5px;
}

.sidebar-section { padding: 6px 12px 3px; font-size: 9.5px; text-transform: uppercase; letter-spacing: 1px; color: #475569; font-weight: 500; margin-top: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 13px; margin: 1px 7px;
  border-radius: var(--radius-sm); cursor: pointer;
  color: #94a3b8; font-size: 12.5px; font-weight: 400;
  transition: all .15s ease; text-decoration: none;
}
.nav-item:hover { background: var(--sidebar-hover); color: #e2e8f0; }
.nav-item.active { background: var(--accent); color: #fff; font-weight: 500; }
.nav-item .icon { width: 16px; height: 16px; opacity: .8; flex-shrink: 0; }
.nav-item.active .icon { opacity: 1; }
.sidebar-bottom { margin-top: auto; padding: 10px; border-top: 1px solid #1e293b; }
.user-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  background: #1e293b; cursor: pointer;
}
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0; }
.user-info { overflow: hidden; }
.user-name { font-size: 13px; font-weight: 500; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: #64748b; }

/* ─── SYNC BADGE ─── */
#sync-badge {
  margin: 6px 10px; padding: 5px 8px;
  border-radius: var(--radius-sm); font-size: 11px;
  display: flex; align-items: center; gap: 5px;
  background: #1e293b; color: #94a3b8;
  cursor: pointer; transition: .15s;
}
#sync-badge.online { color: #4ade80; }
#sync-badge.offline { color: #f87171; }
#sync-badge.syncing { color: #facc15; }
#sync-badge.pending { color: #fb923c; }
.pulse { animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ─── MAIN ─── */
#main {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; height: 100vh; min-width: 0;
}
#topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 9px 20px; display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
#page-title { font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#content { flex: 1; overflow-y: auto; padding: 18px 20px; }

/* ─── COMMON COMPONENTS ─── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 13px; border-radius: var(--radius-sm);
  font-family: var(--font-body); font-size: 12.5px; font-weight: 500;
  cursor: pointer; border: none; transition: all .15s;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #d14f1e; }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-ghost { background: transparent; color: var(--text-2); border: 1px solid transparent; }
.btn-ghost:hover { background: var(--bg); border-color: var(--border); }
.btn-danger { background: #fee2e2; color: var(--danger); }
.btn-danger:hover { background: #fecaca; }
.btn-sm { padding: 4px 9px; font-size: 11.5px; }
.btn-icon { padding: 5px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-family: var(--font-head); font-size: 14px; font-weight: 700; }

/* ─── STATUS BADGES ─── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500;
}
.badge-prospecto { background: #dbeafe; color: #1d4ed8; }
.badge-cliente { background: #dcfce7; color: #15803d; }
.badge-inactivo { background: #f3f4f6; color: #6b7280; }
.badge-otro { background: #fef3c7; color: #92400e; }
.badge-pendiente { background: #fef3c7; color: #92400e; }
.badge-en_curso { background: #dbeafe; color: #1d4ed8; }
.badge-completada { background: #dcfce7; color: #15803d; }
.badge-cancelada { background: #fee2e2; color: #991b1b; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500;
  background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;
}

/* ─── FORM ─── */
.form-group { margin-bottom: 11px; }
.form-label { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
.form-control {
  width: 100%; padding: 6px 10px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 12.5px;
  background: var(--surface); color: var(--text); transition: border-color .15s;
  outline: none;
}
.form-control:focus { border-color: var(--accent); }
select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* ─── SEARCH ─── */
.search-wrap { position: relative; }
.search-wrap input { padding-left: 36px; }
.search-wrap .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }

/* ─── TABLE ─── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 10.5px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px; border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafaf9; }
td .contact-name { font-weight: 600; color: var(--text); cursor: pointer; }
td .contact-name:hover { color: var(--accent); }
td .text-secondary { font-size: 11px; color: var(--text-2); }

/* ─── MODAL ─── */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border-radius: var(--radius);
  width: 560px; max-width: 95vw; max-height: 88vh;
  overflow-y: auto; box-shadow: var(--shadow-lg);
  transform: translateY(10px); transition: transform .2s;
}
#modal-overlay.open .modal { transform: translateY(0); }
.modal-header {
  padding: 14px 20px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.modal-title { font-family: var(--font-head); font-size: 15px; font-weight: 700; }
.modal-body { padding: 16px 20px; }
.modal-footer { padding: 11px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* ─── TABS ─── */
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
.tab-btn {
  padding: 8px 16px; font-size: 13.5px; font-weight: 500;
  color: var(--text-2); cursor: pointer; border: none; background: transparent;
  border-bottom: 2px solid transparent; margin-bottom: -2px; transition: .15s;
  font-family: var(--font-body);
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:hover:not(.active) { color: var(--text); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ─── TIMELINE ─── */
.timeline { position: relative; }
.timeline-item { display: flex; gap: 14px; padding-bottom: 18px; position: relative; }
.timeline-item::before { content:''; position: absolute; left: 15px; top: 28px; bottom: 0; width: 2px; background: var(--border); }
.timeline-item:last-child::before { display: none; }
.timeline-dot {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; background: var(--accent-light); color: var(--accent);
}
.timeline-content { flex: 1; min-width: 0; }
.timeline-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.timeline-type { font-weight: 600; font-size: 13.5px; }
.timeline-meta { font-size: 11.5px; color: var(--text-3); flex-shrink: 0; }
.timeline-desc { font-size: 13px; color: var(--text-2); margin-top: 3px; }
.timeline-next { font-size: 12px; color: var(--accent); margin-top: 4px; }

/* ─── STATS CARDS ─── */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat-card {
  background: var(--surface); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); border-left: 3px solid var(--accent);
}
.stat-card:nth-child(2) { border-left-color: var(--accent2); }
.stat-card:nth-child(3) { border-left-color: var(--success); }
.stat-card:nth-child(4) { border-left-color: var(--warning); }
.stat-value { font-family: var(--font-head); font-size: 24px; font-weight: 800; line-height: 1; }
.stat-label { font-size: 11px; color: var(--text-2); margin-top: 3px; }

/* ─── CALENDAR ─── */
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-header { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; padding: 8px 4px; }
.cal-day {
  min-height: 80px; padding: 7px 6px 5px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 12px; cursor: pointer; transition: .15s;
  display: flex; flex-direction: column; gap: 3px; overflow: hidden;
}
.cal-day:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(232,93,38,.12); }
.cal-day.today { border-color: var(--accent); background: var(--accent-light); }
.cal-day.other-month { opacity: .4; }
.cal-day .day-num {
  font-weight: 700; font-size: 11.5px; color: var(--text-2);
  line-height: 1; margin-bottom: 2px; flex-shrink: 0;
}
.cal-day.today .day-num {
  background: var(--accent); color: #fff; border-radius: 50%;
  width: 19px; height: 19px; display: flex; align-items: center; justify-content: center; font-size: 10.5px;
}
.cal-task-card {
  border-radius: 4px; padding: 2px 5px; font-size: 10.5px; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 500; flex-shrink: 0; border-left: 2.5px solid transparent;
  transition: opacity .1s;
}
.cal-task-card:hover { opacity: .8; }
.cal-task-card.pri-alta   { background: #fee2e2; color: #b91c1c; border-color: #ef4444; }
.cal-task-card.pri-normal { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
.cal-task-card.pri-baja   { background: #dcfce7; color: #166534; border-color: #22c55e; }
.cal-task-card.done       { background: #f1f5f9; color: var(--text-3); border-color: var(--border); text-decoration: line-through; opacity: .7; }
.cal-more { font-size: 10px; color: var(--accent); font-weight: 600; padding: 0 2px; margin-top: 1px; flex-shrink: 0; }
.cal-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.cal-nav h3 { font-family: var(--font-head); font-size: 17px; font-weight: 700; }

/* ─── FILTER BAR ─── */
.filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-chip {
  padding: 5px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 500;
  cursor: pointer; border: 1.5px solid var(--border); background: var(--surface);
  color: var(--text-2); transition: .15s;
}
.filter-chip.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.filter-chip:hover:not(.active) { border-color: var(--text-2); color: var(--text); }

/* ─── EMPTY STATE ─── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-2); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
.empty-state h3 { font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-state p { font-size: 13px; }

/* ─── CONFLICT ALERT ─── */
.conflict-item { background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 8px; }
.conflict-title { font-weight: 600; color: #92400e; font-size: 13.5px; }
.conflict-detail { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }

/* ─── TOAST ─── */
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 16px; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  font-size: 13.5px; font-weight: 500; max-width: 300px;
  animation: slideIn .2s ease;
}
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } }
.toast-success { background: #dcfce7; color: #15803d; border-left: 4px solid var(--success); }
.toast-error { background: #fee2e2; color: var(--danger); border-left: 4px solid var(--danger); }
.toast-info { background: #dbeafe; color: #1d4ed8; border-left: 4px solid var(--info); }
.toast-warning { background: #fef3c7; color: #92400e; border-left: 4px solid var(--warning); }

/* ─── CONTACT DETAIL HEADER ─── */
.contact-hero {
  background: var(--sidebar); color: #fff; border-radius: var(--radius);
  padding: 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px;
}
.contact-avatar-lg {
  width: 60px; height: 60px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-size: 22px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.contact-hero-info { flex: 1; }
.contact-hero-name { font-family: var(--font-head); font-size: 22px; font-weight: 800; }
.contact-hero-sub { font-size: 13px; color: #94a3b8; margin-top: 2px; }
.contact-hero-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ─── INFO GRID ─── */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.info-field label { font-size: 11.5px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 2px; }
.info-field .info-value { font-size: 14px; color: var(--text); }

/* ─── MULTI-ITEM ─── */
.multi-item-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.multi-item { display: flex; align-items: center; gap: 8px; }
.multi-item input { flex: 1; }
.multi-item .btn-remove { padding: 4px 6px; font-size: 14px; line-height: 1; }
.add-item-btn { font-size: 12.5px; color: var(--accent); cursor: pointer; background: none; border: none; font-family: var(--font-body); padding: 4px 0; display: flex; align-items: center; gap: 4px; }

/* ─── CAMPAIGN ─── */
.campaign-card { cursor: pointer; transition: .15s; }
.campaign-card:hover { box-shadow: var(--shadow-lg); }
.campaign-meta { display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--text-2); }
.campaigns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  #sidebar { width: 60px; min-width: 60px; }
  .sidebar-logo, .sidebar-section, .nav-item span, .user-info, #sync-badge span { display: none; }
  .nav-item { justify-content: center; padding: 10px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  #content { padding: 16px; }
}

/* ─── UTILS ─── */
.flex { display: flex; } .items-center { align-items: center; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; }
.ml-auto { margin-left: auto; } .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; }
.text-sm { font-size: 12.5px; } .text-muted { color: var(--text-2); }
.fw-bold { font-weight: 600; } .mt-4 { margin-top: 16px; }
.w-full { width: 100%; } .hidden { display: none !important; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }

/* ─── NOTAS / NOVEDADES ─── */
.nota-entry {
  border-left: 3px solid var(--border); padding: 10px 14px;
  margin-bottom: 10px; background: var(--bg); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  transition: border-color .15s;
}
.nota-entry:hover { border-left-color: var(--accent2); }
.nota-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.nota-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; flex-shrink: 0; font-family: var(--font-head); }
.nota-meta { font-size: 11px; color: var(--text-2); flex: 1; }
.nota-meta strong { color: var(--text); font-weight: 600; }
.nota-ts { font-size: 10.5px; color: var(--text-3); font-family: monospace; }
.nota-body { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.nota-compose {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 12px; margin-bottom: 16px;
  transition: border-color .15s;
}
.nota-compose:focus-within { border-color: var(--accent); }
.nota-compose textarea {
  width: 100%; border: none; outline: none; resize: none;
  font-family: var(--font-body); font-size: 13px; color: var(--text);
  background: transparent; min-height: 72px; line-height: 1.6;
}
.nota-compose textarea::placeholder { color: var(--text-3); }
.nota-compose-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 8px; border-top: 1px solid var(--border); margin-top: 8px;
}
.nota-count { font-size: 11px; color: var(--text-3); }
.nota-count.near-limit { color: var(--warning); }
.nota-immutable-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; color: var(--text-3); padding: 2px 7px;
  border-radius: 99px; background: var(--bg); border: 1px solid var(--border);
}
/* ─── DOMICILIOS ─── */
.domicilio-item { transition: box-shadow .15s; }
.domicilio-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }

.drop-zone {
  border: 2.5px dashed var(--border); border-radius: var(--radius);
  padding: 44px 24px; text-align: center; cursor: pointer;
  transition: all .2s ease; background: var(--surface);
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent); background: var(--accent-light);
}
.drop-zone .dz-icon { font-size: 40px; margin-bottom: 12px; }

<script>
// ════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════
// ════════════════════════════════════════════
// JSONP — global, usada por Auth y Sync
// ════════════════════════════════════════════
function fetchJSONP(url) {
  return new Promise((resolve, reject) => {
    const cbName = '__synclick_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('JSONP timeout (15s)'));
    }, 15000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const tok = (CONFIG.API_TOKEN && CONFIG.API_TOKEN !== 'TU_TOKEN_AQUI') ? ('&token=' + encodeURIComponent(CONFIG.API_TOKEN)) : '';
    script.src = url + (url.includes('?') ? '' : '?') + tok + '&callback=' + cbName;
    script.onerror = () => { cleanup(); reject(new Error('JSONP load error')); };
    document.head.appendChild(script);
  });
}

const CONFIG = {
  // ⬇ Pegá tu URL de Apps Script aquí para que todos los usuarios la tengan automáticamente
  GAS_URL: localStorage.getItem('gas_url') || 'https://script.google.com/macros/s/AKfycbxHEcRtfuKIrTjwTqmFRehk0eAj-1kdSWV-xl4HD4E_0kKIQCw-GqqWb4CNtv40ICyv/exec',
  API_TOKEN: localStorage.getItem('api_token') || 'TU_TOKEN_AQUI',
  SYNC_INTERVAL: 30000,
  APP_VERSION: '1.0.0',
  CURRENT_USER: null, // set by Auth after login
  SESSION_HOURS: 8,
};

// ════════════════════════════════════════════
// AUTH MODULE — Sheets como fuente de verdad
// ════════════════════════════════════════════
const Auth = (() => {

  const ROLE_PERMS = {
    admin:      { users:true, settings:true, deleteContacts:true, campaigns:true, exports:true, conflicts:true, analytics:true, import:true },
    supervisor: { users:false, settings:false, deleteContacts:true, campaigns:true, exports:true, conflicts:true, analytics:true, import:true },
    agente:     { users:false, settings:false, deleteContacts:false, campaigns:false, exports:false, conflicts:false, analytics:false, import:false },
  };

  let _cache = [];

  function _saveCache(users) {
    _cache = users;
    // Guardamos sin hash/salt en localStorage (solo datos públicos para display)
    try {
      const safe = users.map(({ hash, salt, ...u }) => u);
      localStorage.setItem('synclick_users_cache', JSON.stringify(safe));
    } catch(e) {}
  }

  async function hashPassword(password, salt) {
    const encoder = new TextEncoder();
    const data = encoder.encode(salt + password + 'synclickcrm_2024');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function genSalt() {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // Trae usuarios desde Sheets (con credenciales completas para auth)
  async function fetchUsers() {
    if (!CONFIG.GAS_URL) return _cache;
    try {
      const data = await fetchJSONP(CONFIG.GAS_URL + '?action=pull&entity=users');
      const users = (data?.users || []).filter(u => u && u.id && u.username);
      if (users.length) _saveCache(users);
      return users.length ? users : _cache;
    } catch(e) {
      console.warn('fetchUsers fallback a cache:', e.message);
      return _cache;
    }
  }

  // Usuarios disponibles para display (sin credenciales)
  async function getUsers() {
    const users = await fetchUsers();
    return users.map(({ hash, salt, ...u }) => u);
  }

  // Crea usuario y escribe directo a Sheets
  async function createUser({ username, name, role, password, active = true }) {
    const users = await fetchUsers();
    if (users.find(u => u.username?.toLowerCase() === username.toLowerCase()))
      throw new Error('El nombre de usuario ya existe');
    const salt = genSalt();
    const hash = await hashPassword(password, salt);
    const user = { id: uid(), username, name, role, salt, hash,
                   active: active ? 'true' : 'false', createdAt: now(), updatedAt: now() };
    await Sync.enqueue('upsert', 'users', user.id, user);
    _cache = [...users.filter(u => u.id !== user.id), user];
    _saveCache(_cache);
    return user;
  }

  async function login() {
    const username = document.getElementById('login-user').value.trim().toLowerCase();
    const password = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-error');
    const btnEl = document.getElementById('login-btn');
    errEl.style.display = 'none';

    if (!username || !password) {
      errEl.style.display = 'block'; errEl.textContent = 'Completá usuario y contraseña.'; return;
    }

    if (!CONFIG.GAS_URL) {
      errEl.style.display = 'block'; errEl.textContent = 'Servidor no configurado. Contactá al administrador.'; return;
    }

    if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Verificando…'; }

    let users = [], fetchError = null;
    try { users = await fetchUsers(); } catch(e) { fetchError = e.message; }

    if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Ingresar'; }

    if (users.length === 0) {
      errEl.style.display = 'block';
      errEl.innerHTML = `No se pudo obtener usuarios del servidor.` +
        (fetchError ? ` Error: ${fetchError}` : '') +
        ` <a href="${CONFIG.GAS_URL}?action=pull&entity=users" target="_blank" style="color:var(--accent);font-size:11px">Verificar →</a>`;
      return;
    }

    const user = users.find(u => u.username?.toLowerCase() === username);
    if (!user) {
      errEl.style.display='block';
      errEl.textContent='Usuario "' + username + '" no encontrado (' + users.length + ' usuario' + (users.length!==1?'s':'') + ' en Sheets).';
      return;
    }

    const isActive = user.active===true || user.active==='true' || user.active===1;
    if (!isActive) { errEl.style.display='block'; errEl.textContent='Tu cuenta está inactiva. Contactá al administrador.'; return; }

    if (!user.hash || !user.salt) {
      errEl.style.display='block'; errEl.textContent='Credenciales incompletas. Ejecutá repairSheetHeaders() en Apps Script y creá el usuario de nuevo.'; return;
    }

    const hash = await hashPassword(password, user.salt);
    if (hash !== user.hash) { errEl.style.display='block'; errEl.textContent='Contraseña incorrecta.'; return; }

    const session = {
      userId: user.id, username: user.username, name: user.name,
      role: user.role, loginAt: now(),
      expiresAt: new Date(Date.now() + CONFIG.SESSION_HOURS * 3600000).toISOString(),
    };
    localStorage.setItem('synclick_session', JSON.stringify(session));
    CONFIG.CURRENT_USER = session;
    applySession(session);

    setTimeout(() => Audit.log('login', 'users', user.id, { username: user.username }).catch(() => {}), 100);

    const ls = document.getElementById('login-screen');
    ls.classList.add('hide');
    setTimeout(() => ls.style.display = 'none', 400);
    Toast.success(`¡Bienvenido/a, ${user.name}!`);
    Router.render();
  }

  function logout() {
    localStorage.removeItem('synclick_session');
    CONFIG.CURRENT_USER = null;
    document.getElementById('login-user').value = '';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-error').style.display = 'none';
    const ls = document.getElementById('login-screen');
    ls.style.display = 'flex';
    requestAnimationFrame(() => ls.classList.remove('hide'));
    closeProfileMenu();
  }

  function applySession(session) {
    const roleLabels = { admin:'Administrador', supervisor:'Supervisor', agente:'Agente' };
    document.getElementById('nav-avatar').textContent = initials(session.name);
    document.getElementById('nav-username').textContent = session.name;
    document.getElementById('nav-role').textContent = roleLabels[session.role] || session.role;
    const isAdmin = session.role === 'admin';
    const isSA = ['admin','supervisor'].includes(session.role);
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? '' : 'none');
    document.querySelectorAll('.supervisor-only').forEach(el => el.style.display = isSA ? '' : 'none');
  }

  function checkSession() {
    const raw = localStorage.getItem('synclick_session');
    if (!raw) return false;
    try {
      const session = JSON.parse(raw);
      if (new Date(session.expiresAt) < new Date()) { localStorage.removeItem('synclick_session'); return false; }
      CONFIG.CURRENT_USER = session;
      applySession(session);
      return true;
    } catch { return false; }
  }

  function can(perm) { return ROLE_PERMS[CONFIG.CURRENT_USER?.role || 'agente']?.[perm] ?? false; }

  function togglePassword() {
    const input = document.getElementById('login-pass');
    const btn = document.getElementById('pass-toggle-btn');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }
  function toggleProfileMenu() { document.getElementById('profile-menu').classList.toggle('open'); }
  function closeProfileMenu() { document.getElementById('profile-menu').classList.remove('open'); }

  document.addEventListener('click', e => {
    if (!document.getElementById('user-chip-btn')?.contains(e.target)) closeProfileMenu();
  });

  return { login, logout, checkSession, can, applySession, createUser, fetchUsers, getUsers,
           hashPassword, genSalt, togglePassword, toggleProfileMenu, closeProfileMenu,
           debugLogin };
})();

const now = () => new Date().toISOString();
const fmtDate = d => d ? new Date(d).toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
const fmtDatetime = d => d ? new Date(d).toLocaleString('es-AR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const initials = (n='') => n.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
const esc = s => { const t={'&':'&'+'amp;','<':'&'+'lt;','>':'&'+'gt;'}; return String(s||'').replace(/[&<>]/g, c => t[c]); };

const STATUS_LABELS = { prospecto:'Prospecto', cliente:'Cliente', inactivo:'Inactivo', otro:'Otro' };

// ════════════════════════════════════════════
// IndexedDB
// ════════════════════════════════════════════
const DB = (() => {
  let db;
  const STORES = {
    contacts: 'id,status,updatedAt,createdAt',
    gestiones: 'id,contactId,createdAt',
    tasks: 'id,contactId,assignedTo,status,dueDate',
    campaigns: 'id,createdAt',
    campaign_contacts: 'id,campaignId,contactId',
    tags: 'id,name',
    users: 'id,name',
    sync_queue: 'id,entity,entityId,action,ts',
    conflicts: 'id,entity,entityId,ts',
    audit_log: 'id,ts,action,entity,userId',
    notas: 'id,contactId,createdAt',
  };

  function open() {
    return new Promise((res, rej) => {
      const req = indexedDB.open('synclickcrm_v2', 2);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        // Create all stores that don't exist yet (handles both fresh installs and upgrades)
        Object.keys(STORES).forEach(name => {
          if (!d.objectStoreNames.contains(name)) {
            d.createObjectStore(name, { keyPath: 'id' });
          }
        });
      };
      req.onsuccess = e => {
        db = e.target.result;
        // If another tab upgrades the DB, reload to get the new version
        db.onversionchange = () => { db.close(); location.reload(); };
        res(db);
      };
      req.onerror = e => rej(e.target.error);
      // Another tab has the DB open - ask it to close
      req.onblocked = () => {
        console.warn('SynclickCRM: DB upgrade blocked — close other tabs and reload');
      };
    });
  }

  async function ensure() { if (!db) await open(); return db; }

  async function getAll(store) {
    await ensure();
    return new Promise((res, rej) => {
      try {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = e => rej(e.target.error);
      } catch(e) {
        // Store might not exist yet (e.g. mid-upgrade), return empty array
        res([]);
      }
    });
  }

  async function get(store, id) {
    await ensure();
    return new Promise((res, rej) => {
      try {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(id);
        req.onsuccess = () => res(req.result);
        req.onerror = e => rej(e.target.error);
      } catch(e) { res(undefined); }
    });
  }

  async function put(store, data) {
    await ensure();
    return new Promise((res, rej) => {
      try {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(data);
        req.onsuccess = () => res(data);
        req.onerror = e => rej(e.target.error);
      } catch(e) { rej(e); }
    });
  }

  async function del(store, id) {
    await ensure();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).delete(id);
      req.onsuccess = () => res();
      req.onerror = e => rej(e.target.error);
    });
  }

  async function putMany(store, items) {
    await ensure();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      const s = tx.objectStore(store);
      items.forEach(item => s.put(item));
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e.target.error);
    });
  }

  return { open, get, getAll, put, del, putMany };
})();

// ════════════════════════════════════════════
// SYNC ENGINE
// ════════════════════════════════════════════
const Sync = (() => {
  let online = navigator.onLine;
  let syncing = false;
  let queueCount = 0;

  function updateBadge() {
    const badge = document.getElementById('sync-badge');
    const label = document.getElementById('sync-label');
    if (!badge) return;
    badge.className = '';
    if (!online) { badge.classList.add('offline'); label.textContent = 'Sin conexión'; return; }
    if (syncing) { badge.classList.add('syncing'); label.innerHTML='<span class="pulse">Sincronizando…</span>'; return; }
    if (queueCount > 0) { badge.classList.add('pending'); label.textContent = `${queueCount} pendiente${queueCount>1?'s':''}`; return; }
    badge.classList.add('online'); label.textContent = 'Sincronizado ✓';
  }

  async function enqueue(action, entity, entityId, data) {
    const item = {
      id: uid(), action, entity, entityId, data,
      ts: now(),
      userId: CONFIG.CURRENT_USER?.userId || 'anon',
      userRole: CONFIG.CURRENT_USER?.role || 'agente',
    };
    await DB.put('sync_queue', item);
    queueCount++;
    updateBadge();
    if (online) scheduleSync();
  }

  let syncTimer;
  function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(processQueue, 1500); }

  // Envío a GAS con no-cors — la respuesta es "opaca" (status=0, ok=false)
  // pero los datos SÍ llegan al servidor. Tratamos status=0 como éxito.
  async function sendToGAS(item) {
    const resp = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(Object.assign({}, item, { token: CONFIG.API_TOKEN })),
    });
    return { ok: resp.status === 0 || resp.ok, opaque: resp.type === 'opaque' };
  }

  async function processQueue() {
    if (!online || syncing || !CONFIG.GAS_URL) return;
    const queue = await DB.getAll('sync_queue');
    if (!queue.length) { queueCount = 0; updateBadge(); return; }
    syncing = true; updateBadge();
    let processed = 0;

    for (const item of queue) {
      try {
        const result = await sendToGAS(item);
        if (result.ok) {
          await DB.del('sync_queue', item.id);
          processed++;
        }
      } catch (e) {
        console.warn('[Sync] Error:', e.message, 'entity:', item.entity);
      }
    }

    queueCount = Math.max(0, queue.length - processed);
    syncing = false; updateBadge();
  }


  async function pullFromServer() {
    if (!online || !CONFIG.GAS_URL) return;
    try {
      const since = encodeURIComponent(localStorage.getItem('synclick_last_pull') || '');
      const data = await fetchJSONP(CONFIG.GAS_URL + '?action=pull&since=' + since);
      if (!data || data.error) { console.warn('Pull error:', data?.error); return; }
      let imported = 0;
      for (const [store, rows] of Object.entries(data)) {
        if (!Array.isArray(rows) || !rows.length) continue;
        if (store === 'users') continue; // Auth maneja usuarios directamente desde Sheets
        await DB.putMany(store, rows).catch(() => {});
        imported += rows.length;
      }
      localStorage.setItem('synclick_last_pull', new Date().toISOString());
      if (imported > 0) Router.render();
    } catch(e) { console.warn('Pull failed:', e.message); }
  }

  // Prueba de sincronización — muestra resultado detallado
  async function debugSync() {
    if (!CONFIG.GAS_URL) return { error: 'Sin URL configurada' };
    const testItem = {
      id: 'debug-test-' + Date.now(),
      action: 'upsert', entity: 'tags',
      entityId: 'debug-tag-001',
      data: { id: 'debug-tag-001', name: 'TEST_SYNC_' + Date.now() },
      ts: new Date().toISOString(),
      userId: CONFIG.CURRENT_USER?.userId || 'debug',
      userRole: CONFIG.CURRENT_USER?.role || 'admin',
    };

    const results = {};

    // Test 1: POST no-cors (write)
    try {
      const resp = await fetch(CONFIG.GAS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(testItem),
      });
      results['POST no-cors (escritura)'] = {
        ok: resp.status === 0 || resp.ok,
        detail: `type=${resp.type} status=${resp.status} — ${resp.type==='opaque' ? '✅ Respuesta opaca = datos enviados correctamente' : resp.ok ? '✅ OK' : '❌ Falló'}`
      };
    } catch(e) { results['POST no-cors (escritura)'] = { ok: false, detail: '❌ ' + e.message }; }

    // Test 2: JSONP ping (read)
    try {
      const data = await fetchJSONP(CONFIG.GAS_URL + '?action=ping');
      results['JSONP GET (lectura)'] = {
        ok: !!data?.ok,
        detail: data?.ok ? '✅ ' + JSON.stringify(data) : '❌ Respuesta: ' + JSON.stringify(data)
      };
    } catch(e) { results['JSONP GET (lectura)'] = { ok: false, detail: '❌ ' + e.message }; }

    return results;
  }

  async function pullFromServer() {
    if (!online || !CONFIG.GAS_URL) return;
    try {
      const url = CONFIG.GAS_URL + '?action=pull&since=' + encodeURIComponent(localStorage.getItem('last_pull')||'');
      const resp = await fetch(url, { method: 'GET', redirect: 'follow' });
      if (!resp.ok) return;
      const data = await resp.json();
      if (data.error) { console.warn('Pull error:', data.error); return; }
      for (const [store, rows] of Object.entries(data)) {
        if (!Array.isArray(rows) || !rows.length) continue;
        if (store === 'users') continue; // Auth maneja usuarios directamente desde Sheets
        await DB.putMany(store, rows).catch(() => {});
      }
      localStorage.setItem('last_pull', now());
    } catch(e) { console.warn('Pull failed:', e.message); }
  }

  // Empuja TODOS los datos locales al servidor (útil en primera conexión)
  async function pushAllLocalData() {
    if (!online || !CONFIG.GAS_URL) return 0;
    const entities = ['contacts','gestiones','tasks','campaigns','tags','notas']; // usuarios: Auth los gestiona directo en Sheets
    let total = 0;
    for (const entity of entities) {
      try {
        const rows = await DB.getAll(entity);
        for (const row of rows) {
          // Para usuarios enviamos el objeto completo (con hash/salt) para que funcione la auth
          await DB.put('sync_queue', {
            id: uid(), action: 'upsert', entity,
            entityId: row.id, data: row,
            ts: now(), userId: CONFIG.CURRENT_USER?.id || 'anon'
          });
          total++;
        }
      } catch(e) {}
    }
    queueCount = (await DB.getAll('sync_queue')).length;
    updateBadge();
    await processQueue();
    return total;
  }

  async function forceSync() {
    await pullFromServer();
    await processQueue();
    updateBadge();
    Router.render();
  }

  // Listen to network
  window.addEventListener('online', () => { online = true; updateBadge(); processQueue(); });
  window.addEventListener('offline', () => { online = false; updateBadge(); });

  // Periodic sync
  setInterval(processQueue, CONFIG.SYNC_INTERVAL);
  setInterval(async () => { if (online) await pullFromServer(); }, CONFIG.SYNC_INTERVAL * 2);

  async function init() {
    const queue = await DB.getAll('sync_queue');
    queueCount = queue.length;
    updateBadge();
    if (online) { await pullFromServer(); await processQueue(); }
  }

  return { enqueue, forceSync, pushAllLocalData, debugSync, init, get isOnline() { return online; } };
})();

// AUDIT LOG
// ════════════════════════════════════════════
const Audit = {
  ICONS: {
    create: '➕', update: '✏️', delete: '🗑️',
    campaign_exec: '📢', campaign_create: '📋',
    import: '📥', login: '🔑', logout: '🚪',
    status_change: '🔄',
  },

  async log(action, entity, entityId, detail = {}) {
    const user = CONFIG.CURRENT_USER;
    const entry = {
      id: uid(),
      ts: now(),
      action,
      entity,
      entityId: entityId || '',
      detail: JSON.stringify(detail),
      userId: user?.userId || 'anon',
      userName: user?.name || 'Sistema',
      userRole: user?.role || '',
    };
    await DB.put('audit_log', entry);
    // Sync to GAS (non-blocking)
    Sync.enqueue('upsert', 'auditoria', entry.id, entry).catch(() => {});
    return entry;
  },

  async getAll({ days = 30, userId = '', action = '' } = {}) {
    const since = new Date(Date.now() - days * 86400000).toISOString();
    let entries = await DB.getAll('audit_log');
    entries = entries.filter(e => e.ts >= since);
    if (userId) entries = entries.filter(e => e.userId === userId);
    if (action) entries = entries.filter(e => e.action === action);
    return entries.sort((a, b) => b.ts.localeCompare(a.ts));
  },

  async getStats(days = 30) {
    const all = await Audit.getAll({ days });
    const users = await DB.getAll('users');
    const userMap = Object.fromEntries(users.map(u => [u.id, u]));

    // By action
    const byAction = {};
    all.forEach(e => { byAction[e.action] = (byAction[e.action] || 0) + 1; });

    // By agent
    const byAgent = {};
    all.forEach(e => {
      if (!byAgent[e.userId]) byAgent[e.userId] = { userId: e.userId, name: e.userName, count: 0, creates: 0, updates: 0, deletes: 0, campaigns: 0, imports: 0 };
      byAgent[e.userId].count++;
      if (e.action === 'create') byAgent[e.userId].creates++;
      if (e.action === 'update') byAgent[e.userId].updates++;
      if (e.action === 'delete') byAgent[e.userId].deletes++;
      if (e.action.startsWith('campaign')) byAgent[e.userId].campaigns++;
      if (e.action === 'import') byAgent[e.userId].imports++;
    });

    // By day (last N days)
    const byDay = {};
    const todayStr = new Date().toISOString().split('T')[0];
    for (let i = 0; i < Math.min(days, 30); i++) {
      const d = new Date(Date.now() - i * 86400000).toISOString().split('T')[0];
      byDay[d] = 0;
    }
    all.forEach(e => {
      const d = e.ts.split('T')[0];
      if (byDay[d] !== undefined) byDay[d]++;
    });

    // Campaign stats
    const campaigns = await DB.getAll('campaigns');
    const contacts = await DB.getAll('contacts');
    const campStats = campaigns.map(c => ({
      ...c,
      contactCount: contacts.filter(x => (x.campaigns || []).includes(c.id)).length,
      executions: all.filter(e => e.action === 'campaign_exec' && e.entityId === c.id).length,
    }));

    return {
      total: all.length,
      byAction,
      byAgent: Object.values(byAgent).sort((a, b) => b.count - a.count),
      byDay,
      campStats,
      allEntries: all,
    };
  },
};

const Data = {

    contact.updatedAt = now();
    contact.createdAt = contact.createdAt || now();
    contact.updatedBy = CONFIG.CURRENT_USER?.userId || 'anon';

    Audit.log(isNew ? 'create' : 'update', 'contacts', contact.id, { nombre: contact.nombre, apellido: contact.apellido, status: contact.status }).catch(() => {});

  },
  async getContacts() { return DB.getAll('contacts'); },

  async saveGestion(g) {

    nota.userRole = CONFIG.CURRENT_USER?.role || 'agente';

  },

  async resolveConflict(id, choice) {
    const c = await DB.get('conflicts', id);
    if (!c) return;
    const data = choice === 'local' ? c.local : c.remote;
    await DB.put(c.entity, data);
    await DB.del('conflicts', id);
    if (choice === 'local') await Sync.enqueue('upsert', c.entity, c.entityId, data);
    Toast.success('Conflicto resuelto');
  },

  async getStats() {
    const contacts = await DB.getAll('contacts');
    const tasks = await DB.getAll('tasks');
    const queue = await DB.getAll('sync_queue');
    return {
      total: contacts.length,
      prospectos: contacts.filter(c=>c.status==='prospecto').length,
      clientes: contacts.filter(c=>c.status==='cliente').length,
      tareas_hoy: tasks.filter(t=>{
        const d = t.dueDate?.split('T')[0];
        return d === new Date().toISOString().split('T')[0] && t.status !== 'completada';
      }).length,
      pending_sync: queue.length,
    };
  }
};

const Export = {
  toCSV(data, filename) {
    if (!data.length) return Toast.warning('No hay datos para exportar');
    const keys = Object.keys(data[0]);
    const rows = [keys.join(','), ...data.map(r => keys.map(k => JSON.stringify(r[k]??'')).join(','))];
    const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename + '.csv'; a.click();
    URL.revokeObjectURL(url);
  },
  toJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename + '.json'; a.click();
    URL.revokeObjectURL(url);
  }
};

// ════════════════════════════════════════════
// CSV IMPORT ENGINE
// ════════════════════════════════════════════
const Importer = {
  // Parse raw CSV text into array of objects
  parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) throw new Error('El archivo debe tener al menos una fila de encabezados y una de datos');
    const sep = text.includes(';') ? ';' : ',';

    const parseRow = line => {
      const cells = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; continue; }
        if (ch === sep && !inQ) { cells.push(cur.trim()); cur = ''; continue; }
        cur += ch;
      }
      cells.push(cur.trim());
      return cells;
    };

    const headers = parseRow(lines[0]).map(h => h.replace(/"/g, '').trim());
    const rows = lines.slice(1).filter(l => l.trim()).map(l => {
      const cells = parseRow(l);
      const obj = {};
      headers.forEach((h, i) => { obj[h] = cells[i] || ''; });
      return obj;
    });
    return { headers, rows };
  },

  // Map from CSV headers to contact fields
  CONTACT_FIELDS: [
    { key: 'nombre', label: 'Nombre', required: true },
    { key: 'apellido', label: 'Apellido' },
    { key: 'razon_social', label: 'Razón social' },
    { key: 'email', label: 'Email' },
    { key: 'telefono', label: 'Teléfono' },
    { key: 'cuit', label: 'CUIT' },
    { key: 'dni', label: 'DNI' },
    { key: 'ciudad', label: 'Ciudad' },
    { key: 'direccion', label: 'Dirección' },
    { key: 'status', label: 'Estado (prospecto/cliente/inactivo)' },
    { key: 'condicion', label: 'Condición impositiva' },
    { key: 'observaciones', label: 'Observaciones' },
    { key: 'tags', label: 'Etiquetas (separadas por |)' },
    { key: '_skip', label: '— Ignorar columna —' },
  ],

  // Auto-detect mapping based on header names
  autoMap(headers) {
    const normalize = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
    const aliases = {
      nombre: ['nombre', 'name', 'firstname', 'first_name', 'primer_nombre'],
      apellido: ['apellido', 'lastname', 'last_name', 'surname', 'segundo_nombre'],
      razon_social: ['razonsocial', 'empresa', 'company', 'business', 'razon'],
      email: ['email', 'correo', 'mail', 'email1', 'correoelectronico'],
      telefono: ['telefono', 'phone', 'tel', 'celular', 'movil', 'mobile', 'whatsapp'],
      cuit: ['cuit', 'taxid', 'ruc'],
      dni: ['dni', 'documento', 'cedula', 'id'],
      ciudad: ['ciudad', 'city', 'localidad', 'zona'],
      direccion: ['direccion', 'address', 'domicilio', 'calle'],
      status: ['estado', 'status', 'tipo'],
      condicion: ['condicion', 'condition', 'impositiva'],
      observaciones: ['obs', 'observaciones', 'notes', 'notas', 'comentarios'],
      tags: ['tags', 'etiquetas', 'labels', 'categorias'],
    };
    const map = {};
    headers.forEach(h => {
      const norm = normalize(h);
      let matched = '_skip';
      for (const [field, alts] of Object.entries(aliases)) {
        if (alts.some(a => norm.includes(a) || a.includes(norm))) { matched = field; break; }
      }
      map[h] = matched;
    });
    return map;
  },

  // Validate and transform a row using mapping
  transformRow(row, mapping) {
    const contact = { status: 'prospecto', tags: [] };
    const warnings = [];
    for (const [csvCol, field] of Object.entries(mapping)) {
      if (field === '_skip') continue;
      const val = String(row[csvCol] || '').trim();
      if (!val) continue;
      if (field === 'tags') {
        contact.tags = val.split(/[|,;]/).map(t => t.trim()).filter(Boolean);
      } else if (field === 'status') {
        const s = val.toLowerCase();
        if (['prospecto','cliente','inactivo','otro'].includes(s)) contact.status = s;
        else { contact.status = 'prospecto'; warnings.push(`Estado "${val}" desconocido, se usó "prospecto"`); }
      } else {
        contact[field] = val;
      }
    }
    if (!contact.nombre) warnings.push('Sin nombre — fila ignorada');
    return { contact, warnings, valid: !!contact.nombre };
  },

  async importBatch(rows, mapping, onProgress) {
    let ok = 0, skipped = 0, errors = 0;
    const total = rows.length;
    for (let i = 0; i < rows.length; i++) {
      const { contact, valid } = Importer.transformRow(rows[i], mapping);
      if (valid) {
        try {
          await Data.saveContact(contact);
          ok++;
        } catch { errors++; }
      } else { skipped++; }
      if (onProgress) onProgress(i + 1, total, ok, skipped, errors);
      // Yield to browser every 50 rows
      if (i % 50 === 0) await new Promise(r => setTimeout(r, 0));
    }
    await Audit.log('import', 'contacts', '', { total, ok, skipped, errors });
    return { ok, skipped, errors };
  },
};

        ${id === CONFIG.CURRENT_USER?.userId ? '<span class="text-muted text-sm">(No podés desactivarte a vos mismo)</span>' : ''}
      </div>
    `, `

      <button class="btn btn-primary" onclick="Views.saveEditUser('${id}')">Guardar cambios</button>
    `);

  async saveEditUser(id) {
    const allUsers = await Auth.fetchUsers();
    const user = allUsers.find(u => u.id === id);
    if (!user) return;
    const name = document.getElementById('eu-name').value.trim();
    if (!name) return Toast.error('El nombre es requerido');
    const roleEl = document.getElementById('eu-role');
    const activeEl = document.getElementById('eu-active');
    user.name = name;
    if (id !== CONFIG.CURRENT_USER?.userId) {
      user.role = roleEl.value;
      user.active = activeEl.checked ? 'true' : 'false';
    }
    user.updatedAt = now();
    await Sync.enqueue('upsert','users',user.id,user);
    Modal.close(); Toast.success('Usuario actualizado'); Views.users();
  },

  async toggleUserActive(id) {
    const allUsers = await Auth.fetchUsers();
    const user = allUsers.find(u => u.id === id);
    if (!user) return;
    const isActive = user.active === true || user.active === 'true';
    if (user.role === 'admin' && isActive) {
      const admins = allUsers.filter(u => u.role === 'admin' && (u.active === true || u.active === 'true'));
      if (admins.length <= 1) { Toast.error('No podés desactivar al último administrador'); return; }
    }
    user.active = isActive ? 'false' : 'true';
    user.updatedAt = now();
    await Sync.enqueue('upsert','users',user.id,user);
    Toast.success(user.active === 'true' ? 'Usuario activado' : 'Usuario desactivado'); Views.users();
  },

  confirmDeleteUser(id, name) {
    Modal.open('Eliminar usuario', `
      <div style="text-align:center;padding:8px 0 16px">
        <div style="font-size:32px;margin-bottom:12px">🗑</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:8px">Eliminar usuario</div>
        <div style="font-size:13px;color:var(--text-2)">Esta accion es permanente y no se puede deshacer.</div>
      </div>
    `, `
      <button class="btn btn-secondary" onclick="Modal.close()">Cancelar</button>
      <button class="btn btn-danger" onclick="Views.deleteUser('${id}')">Si, eliminar</button>
    `);
  },

  async deleteUser(id) {
    const allUsers = await Auth.fetchUsers();
    const user = allUsers.find(u => u.id === id);
    if (!user) { Modal.close(); Toast.error('Usuario no encontrado'); return; }
    if (user.role === 'admin') {
      const admins = allUsers.filter(u => u.role === 'admin');
      if (admins.length <= 1) { Toast.error('No podes eliminar al unico administrador'); return; }
    }
    await Sync.enqueue('delete', 'users', id, {});
    await Sync.forceSync();
    Modal.close();
    Toast.success('Usuario eliminado');
    Views.users();
  },

  switchModalTab(btn, tabId) {
    document.querySelectorAll('.modal .tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.modal .tab-pane').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');

  },

  _notaCount2(el) {
    const len = el.value.length;
    const counter = document.getElementById('modal-nota-count');
    if (counter) {
      counter.textContent = `${len} / 2000`;
      counter.className = 'nota-count' + (len > 1800 ? ' near-limit' : '');
    }
  },

  async saveModalNota(contactId) {
    const textarea = document.getElementById('modal-nota-text');
    const text = textarea?.value?.trim();
    if (!text) { Toast.error('Escribí algo antes de registrar'); return; }

    const btn = document.querySelector('#modal-nota-compose .btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

    const nota = await Data.saveNota({ contactId, observacion: text });

    textarea.value = '';
    Views._notaCount2(textarea);
    if (btn) { btn.disabled = false; btn.textContent = 'Registrar'; }

    // Prepend new entry to the list
    const list = document.getElementById('modal-notas-list');
    const emptyState = list?.querySelector('.empty-state');
    if (emptyState) emptyState.remove();
    const isAdmin = CONFIG.CURRENT_USER?.role === 'admin';
    list.insertAdjacentHTML('afterbegin', Views._renderNota(nota, isAdmin));

    // Update tab badge count
    const allNotas = await Data.getNotas(contactId);
    const commsTab = document.querySelector('[onclick*="tab-comms"]');
    if (commsTab) {
      commsTab.innerHTML = `Comunicaciones <span style="background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:3px">${allNotas.length}</span>`;
    }

    Toast.success('Comunicación registrada');
  },

  addExtraField(containerId, type, attr) {
    const c = document.getElementById(containerId);
    const idx = c.querySelectorAll('['+attr+']').length;
    const div = document.createElement('div');
    div.className = 'multi-item mb-2';
    div.innerHTML = `<input class="form-control" type="${type}" ${attr}="${idx}"><button class="btn btn-ghost btn-remove" onclick="this.parentElement.remove()">✕</button>`;
    c.appendChild(div);
  },

  addDomicilio() {
    const list = document.getElementById('domicilios-list');
    const idx = list.querySelectorAll('.domicilio-item').length;
    const div = document.createElement('div');
    div.className = 'domicilio-item';
    div.setAttribute('data-dom-idx', idx);
    div.style.cssText = 'background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Domicilio ${idx+1}</span>
        <button class="btn btn-ghost btn-remove btn-sm" onclick="this.closest('.domicilio-item').remove();Views._renumberDomicilios()">✕ Quitar</button>
      </div>
      <div class="form-row" style="margin-bottom:6px">
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Calle</label><input class="form-control dom-calle" placeholder="Ej: Av. San Martín" value=""></div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Altura / Nro.</label><input class="form-control dom-altura" placeholder="Ej: 1234" value=""></div>
      </div>
      <div class="form-row" style="margin-bottom:0">
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Barrio</label><input class="form-control dom-barrio" placeholder="Ej: Centro" value=""></div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Ciudad</label><input class="form-control dom-ciudad" placeholder="Ej: Comodoro Rivadavia" value=""></div>
      </div>`;
    list.appendChild(div);
  },

  _renumberDomicilios() {
    document.querySelectorAll('#domicilios-list .domicilio-item').forEach((el, i) => {
      const label = el.querySelector('span');
      if (label) label.textContent = `Domicilio ${i+1}`;
    });
  },

  _readDomicilios() {
    return [...document.querySelectorAll('#domicilios-list .domicilio-item')].map(el => ({
      calle:  el.querySelector('.dom-calle')?.value.trim()  || '',
      altura: el.querySelector('.dom-altura')?.value.trim() || '',
      barrio: el.querySelector('.dom-barrio')?.value.trim() || '',
      ciudad: el.querySelector('.dom-ciudad')?.value.trim() || '',
    })).filter(d => d.calle || d.ciudad);
  },

  async addTagFromModal() {
    const input = document.getElementById('new-tag-input');
    const name = input.value.trim();
    if (!name) return;
    await Data.saveTag({ name });
    const list = document.getElementById('tag-list');
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px';
    label.innerHTML = `<input type="checkbox" value="${esc(name)}" checked> ${esc(name)}`;
    list.appendChild(label);
    input.value = '';
    Toast.success('Etiqueta "' + name + '" creada');
  },

  async saveContactFromModal(id) {
    const nombre = document.getElementById('c-nombre').value.trim();
    if (!nombre) return Toast.error('El nombre es requerido');

    const emails_extra = [...document.querySelectorAll('[data-extra-email]')].map(i=>i.value.trim()).filter(Boolean);
    const telefonos_extra = [...document.querySelectorAll('[data-extra-tel]')].map(i=>i.value.trim()).filter(Boolean);
    const tags = [...document.querySelectorAll('#tag-list input:checked')].map(i=>i.value);
    const hashtags = document.getElementById('c-hashtags').value.trim().split(/\s+/).filter(h=>h.startsWith('#'));

    const domicilios = Views._readDomicilios();
    // Keep backward-compat ciudad field from first domicilio
    const ciudad = domicilios[0]?.ciudad || document.getElementById('c-ciudad')?.value?.trim() || '';

    const contact = {
      id: id || undefined,
      nombre,
      apellido: document.getElementById('c-apellido').value.trim(),
      razon_social: document.getElementById('c-razon').value.trim(),
      dni: document.getElementById('c-dni').value.trim(),
      cuit: document.getElementById('c-cuit').value.trim(),
      condicion: document.getElementById('c-condicion').value,
      status: document.getElementById('c-status').value,
      num_socio: document.getElementById('c-socio').value.trim(),
      num_cuenta: document.getElementById('c-cuenta').value.trim(),
      observaciones: document.getElementById('c-obs').value.trim(),
      email: document.getElementById('c-email').value.trim(),
      emails_extra,
      telefono: document.getElementById('c-tel').value.trim(),
      telefonos_extra,
      ciudad,
      domicilios,
      tags, hashtags,
    };
    if (id) contact.id = id;

    await Data.saveContact(contact);
    Modal.close();
    Toast.success(id ? 'Contacto actualizado' : 'Contacto creado');
    Views.contacts();
  },

  // ── CONTACT DETAIL ──

    document.getElementById('content').innerHTML = `
      <div class="contact-hero">
        <div class="contact-avatar-lg">${initials(c.nombre+' '+(c.apellido||''))}</div>
        <div class="contact-hero-info">
          <div class="contact-hero-name">${esc(c.nombre)} ${esc(c.apellido||'')}</div>

        <button class="tab-btn" onclick="Views.switchTab(this,'det-tasks')">Tareas (${tasks.length})</button>
        <button class="tab-btn" onclick="Views.switchTab(this,'det-notas')">Novedades ${notas.length ? `<span style="background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:4px">${notas.length}</span>` : ''}</button>
      </div>

      <div id="det-info" class="tab-pane active">
        <div class="card">
          <div class="card-title mb-4">Información personal</div>
          <div class="info-grid">
            ${[
              ['DNI', c.dni], ['CUIT', c.cuit], ['Condición', c.condicion], ['N° Socio', c.num_socio], ['N° Cuenta', c.num_cuenta],
              ['Email', c.email], ['Teléfono', c.telefono],
            ].map(([l,v])=>`<div class="info-field"><label>${l}</label><div class="info-value">${esc(v||'—')}</div></div>`).join('')}
          </div>
          ${(c.domicilios||[]).length ? `
            <div class="divider"></div>
            <div class="form-label" style="margin-bottom:8px">Domicilios</div>
            <div style="display:flex;flex-direction:column;gap:8px">
              ${(c.domicilios||[]).map((d,i)=>`
                <div style="background:var(--bg);border-radius:var(--radius-sm);padding:8px 12px;border-left:3px solid var(--accent)">
                  <div style="font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:3px">DOMICILIO ${i+1}</div>
                  <div style="font-size:13px;font-weight:500">${esc(d.calle||'')}${d.altura?' '+esc(d.altura):''}</div>
                  <div style="font-size:12px;color:var(--text-2)">${[d.barrio,d.ciudad].filter(Boolean).map(esc).join(' · ')}</div>
                </div>`).join('')}
            </div>` : (c.ciudad||c.direccion) ? `
            <div class="divider"></div>
            <div class="info-grid">
              ${c.ciudad ? `<div class="info-field"><label>Ciudad</label><div class="info-value">${esc(c.ciudad)}</div></div>` : ''}
              ${c.direccion ? `<div class="info-field"><label>Dirección</label><div class="info-value">${esc(c.direccion)}</div></div>` : ''}

          ${(c.emails_extra?.length||c.telefonos_extra?.length)?`
            <div class="divider"></div>
            <div class="info-grid">
              ${(c.emails_extra||[]).map((e,i)=>`<div class="info-field"><label>Email ${i+2}</label><div class="info-value">${esc(e)}</div></div>`).join('')}
              ${(c.telefonos_extra||[]).map((t,i)=>`<div class="info-field"><label>Tel. ${i+2}</label><div class="info-value">${esc(t)}</div></div>`).join('')}
            </div>`:''}

          ${(c.hashtags?.length)?`<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${c.hashtags.map(h=>`<span class="tag-chip" style="background:#f0fdf4;color:#166534">${esc(h)}</span>`).join('')}</div>`:''}
        </div>
      </div>

      <div id="det-gest" class="tab-pane">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Historial de gestiones</span>
            <button class="btn btn-primary btn-sm" onclick="Views.showGestionModal('${id}')">+ Nueva gestión</button>
          </div>
          ${gestiones.length ? `<div class="timeline">${gestiones.map(g=>`
            <div class="timeline-item">
              <div class="timeline-dot">${GESTION_ICONS[g.tipo]||'📌'}</div>
              <div class="timeline-content">
                <div class="timeline-header">
                  <span class="timeline-type">${esc(g.tipo)}</span>
                  <span class="timeline-meta">${fmtDatetime(g.createdAt)} · ${esc(g.userName||'?')}</span>
                </div>
                <div class="timeline-desc">${esc(g.descripcion||'')}</div>
                ${g.resultado?`<div class="timeline-desc" style="margin-top:3px">Resultado: ${esc(g.resultado)}</div>`:''}
                ${g.proxima_accion?`<div class="timeline-next">→ Próxima acción: ${esc(g.proxima_accion)}</div>`:''}
              </div>
            </div>`).join('')}</div>`
          : `<div class="empty-state"><div class="empty-icon">📞</div><h3>Sin gestiones</h3><p>Registrá la primera interacción con este contacto.</p></div>`}
        </div>
      </div>

      <div id="det-tasks" class="tab-pane">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Tareas</span>
            <button class="btn btn-primary btn-sm" onclick="Views.showTaskModal('${id}')">+ Nueva tarea</button>
          </div>
          ${tasks.length ? tasks.map(t=>`
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
              <span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span>
              <div style="flex:1">
                <div style="font-weight:500">${esc(t.title)}</div>
                <div class="text-muted text-sm">Vence: ${fmtDate(t.dueDate)} · Prioridad: ${t.priority||'normal'}</div>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="Views.completeTask('${t.id}','${id}')">✓</button>
            </div>
          `).join('')
          : `<div class="empty-state"><div class="empty-icon">✅</div><h3>Sin tareas</h3><p>Agendá seguimientos para este contacto.</p></div>`}
        </div>
      </div>

      <div id="det-notas" class="tab-pane">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Novedades del contacto</span>
            <span class="nota-immutable-badge">🔒 Registros inmutables</span>
          </div>

          <!-- Compose area -->
          <div class="nota-compose" id="nota-compose-box">
            <textarea id="nota-text" maxlength="2000"
              placeholder="Escribí la novedad o gestión recibida… (máx. 2000 caracteres)"
              oninput="Views._notaCount(this)"></textarea>
            <div class="nota-compose-footer">
              <span class="nota-count" id="nota-char-count">0 / 2000</span>
              <button class="btn btn-primary btn-sm" onclick="Views.saveNota('${id}')">
                Guardar novedad
              </button>
            </div>
          </div>

          <!-- Entries list -->
          <div id="notas-list">
            ${notas.length ? notas.map(n => Views._renderNota(n, isAdmin)).join('') :
              `<div class="empty-state" style="padding:28px 0">
                <div class="empty-icon">📋</div>
                <h3>Sin novedades</h3>
                <p>Las novedades que registres aparecerán aquí con fecha, hora y agente.</p>
              </div>`}
          </div>
        </div>
      </div>
    `;
  },

  _renderNota(n, isAdmin) {
    const ini = (n.userName||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const roleColors = { admin:'#e85d26', supervisor:'#0ea5e9', agente:'#16a34a' };
    const avatarColor = roleColors[n.userRole] || '#71717a';
    const canDelete = isAdmin !== undefined ? isAdmin : (CONFIG.CURRENT_USER?.role === 'admin');
    return `<div class="nota-entry" id="nota-${n.id}">
      <div class="nota-header">
        <div class="nota-avatar" style="background:${avatarColor}">${esc(ini)}</div>
        <div class="nota-meta">
          <strong>${esc(n.userName||'?')}</strong>
          <span style="margin-left:4px;font-size:10px;opacity:.7">(${n.userRole||'agente'})</span>
        </div>
        <span class="nota-ts">${fmtDatetime(n.createdAt)}</span>
        ${canDelete ? `<button class="btn btn-danger btn-sm btn-icon" style="margin-left:6px" title="Eliminar (solo admin)" onclick="Views._confirmDeleteNota('${n.id}','${n.contactId}')">✕</button>` : ''}
      </div>
      <div class="nota-body">${esc(n.observacion)}</div>
    </div>`;
  },

  _notaCount(el) {
    const len = el.value.length;
    const counter = document.getElementById('nota-char-count');
    if (counter) {
      counter.textContent = `${len} / 2000`;
      counter.className = 'nota-count' + (len > 1800 ? ' near-limit' : '');
    }
  },

  async saveNota(contactId) {
    const textarea = document.getElementById('nota-text');
    const text = textarea?.value?.trim();
    if (!text) { Toast.error('Escribí algo antes de guardar'); return; }
    if (text.length > 2000) { Toast.error('Máximo 2000 caracteres'); return; }

    const btn = document.querySelector('#nota-compose-box .btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

    const nota = await Data.saveNota({ contactId, observacion: text });

    textarea.value = '';
    Views._notaCount(textarea);
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar novedad'; }

    // Prepend the new nota at the top of the list (no full reload)
    const list = document.getElementById('notas-list');
    const isAdmin = CONFIG.CURRENT_USER?.role === 'admin';
    const emptyState = list?.querySelector('.empty-state');
    if (emptyState) emptyState.remove();
    list.insertAdjacentHTML('afterbegin', Views._renderNota(nota, isAdmin));

    // Update tab counter
    const notas = await Data.getNotas(contactId);
    const tabBtn = document.querySelector('[onclick*="det-notas"]');
    if (tabBtn) {
      tabBtn.innerHTML = `Novedades <span style="background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:4px">${notas.length}</span>`;
    }

    Toast.success('Novedad registrada');
  },

  _confirmDeleteNota(notaId, contactId) {
    if (!confirm('¿Eliminar esta novedad? Esta acción queda registrada en la auditoría.')) return;
    Views._deleteNota(notaId, contactId);
  },

  async _deleteNota(notaId, contactId) {
    await Data.deleteNota(notaId);
    // Remove from both possible list containers
    const el = document.getElementById(`nota-${notaId}`);
    if (el) {
      el.style.transition = 'opacity .2s, transform .2s';
      el.style.opacity = '0';
      el.style.transform = 'translateX(-8px)';
      setTimeout(() => {
        el.remove();
        // Show empty state in whichever list is now empty
        for (const listId of ['notas-list', 'modal-notas-list']) {
          const list = document.getElementById(listId);
          if (list && !list.querySelector('.nota-entry')) {
            list.innerHTML = `<div class="empty-state" style="padding:20px 0"><div class="empty-icon" style="font-size:28px">💬</div><p style="font-size:12.5px">Aún no hay comunicaciones registradas para este contacto.</p></div>`;
          }
        }
      }, 220);
    }
    // Update tab badge in both detail view and modal
    const notas = await Data.getNotas(contactId);
    const count = notas.length;
    for (const sel of ['[onclick*="det-notas"]', '[onclick*="tab-comms"]']) {
      const tabBtn = document.querySelector(sel);
      if (tabBtn) {
        const label = sel.includes('det-notas') ? 'Novedades' : 'Comunicaciones';
        tabBtn.innerHTML = count
          ? `${label} <span style="background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:3px">${count}</span>`
          : label;
      }
    }
    Toast.success('Registro eliminado');
  },

  switchTab(btn, tabId) {
    document.querySelectorAll('#content .tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('#content .tab-pane').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(tabId)?.classList.add('active');
  },

  async completeTask(taskId, contactId) {
    const t = await DB.get('tasks', taskId);
    if (t) { t.status='completada'; t.completedAt=now(); await Data.saveTask(t); }
    Views.contact({ id: contactId });
  },

  // ── GESTIÓN MODAL ──
  showGestionModal(contactId) {
    Modal.open('Registrar gestión', `
      <div class="form-group"><label class="form-label">Tipo de gestión *</label>
        <select class="form-control" id="g-tipo">
          ${GESTION_TYPES.map(t=>`<option>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Descripción</label>
        <textarea class="form-control" id="g-desc" placeholder="Detallá la gestión realizada…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Resultado</label>
          <input class="form-control" id="g-resultado" placeholder="Ej: Interesado, sin respuesta…">
        </div>
        <div class="form-group"><label class="form-label">Próxima acción</label>
          <input class="form-control" id="g-proxima" placeholder="Ej: Llamar en 3 días…">
        </div>
      </div>
    `, `
      <button class="btn btn-secondary" onclick="Modal.close()">Cancelar</button>
      <button class="btn btn-primary" onclick="Views.saveGestion('${contactId}')">Registrar</button>
    `);
  },

  async saveGestion(contactId) {
    const tipo = document.getElementById('g-tipo').value;
    const descripcion = document.getElementById('g-desc').value.trim();
    await Data.saveGestion({ contactId, tipo, descripcion,
      resultado: document.getElementById('g-resultado').value.trim(),
      proxima_accion: document.getElementById('g-proxima').value.trim(),
    });
    Modal.close(); Toast.success('Gestión registrada');
    Views.contact({ id: contactId });
  },

  // ── TASK MODAL ──
  async showTaskModal(contactId='') {
    const users = await Data.getUsers();
    const today = new Date().toISOString().split('T')[0];
    Modal.open('Nueva tarea', `
      <div class="form-group"><label class="form-label">Título *</label><input class="form-control" id="t-title" placeholder="Describí la tarea…"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Fecha de vencimiento</label><input class="form-control" id="t-date" type="date" value="${today}"></div>
        <div class="form-group"><label class="form-label">Hora</label><input class="form-control" id="t-time" type="time"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Prioridad</label>
          <select class="form-control" id="t-priority">
            <option value="baja">Baja</option><option value="normal" selected>Normal</option><option value="alta">Alta</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Asignar a</label>
          <select class="form-control" id="t-assigned">
            <option value="${CONFIG.CURRENT_USER?.id||''}">${CONFIG.CURRENT_USER?.name||'Yo'}</option>
            ${users.filter(u=>u.id!==CONFIG.CURRENT_USER?.id).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-control" id="t-desc" rows="2"></textarea></div>
    `, `
      <button class="btn btn-secondary" onclick="Modal.close()">Cancelar</button>
      <button class="btn btn-primary" onclick="Views.saveTask('${contactId}')">Crear tarea</button>
    `);
  },

  async saveTask(contactId) {
    const title = document.getElementById('t-title').value.trim();
    if (!title) return Toast.error('El título es requerido');
    const dueDate = document.getElementById('t-date').value + (document.getElementById('t-time').value ? 'T'+document.getElementById('t-time').value : '');
    await Data.saveTask({ title, contactId, dueDate,
      priority: document.getElementById('t-priority').value,
      assignedTo: document.getElementById('t-assigned').value,
      description: document.getElementById('t-desc').value.trim(),
      status: 'pendiente',
    });
    Modal.close(); Toast.success('Tarea creada');
    if (contactId) Views.contact({ id: contactId }); else Views.calendar();
  },

  // ── CAMPAIGNS ──
  async campaigns() {
    if (!Auth.can('campaigns')) { Toast.error('Acceso restringido. Necesitás rol Supervisor o Admin.'); Router.go('dashboard'); return; }
    document.getElementById('page-title').textContent = 'Campañas';
    document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="Views.showCampaignModal()">+ Nueva campaña</button>`;
    const campaigns = await Data.getCampaigns();

    document.getElementById('content').innerHTML = `
