  async campaignDetail(id) {
    const camp = await DB.get('campaigns', id);
    if (!camp) return;
    const allContacts = await Data.getContacts();
    const tags = await Data.getTags();
    let campContacts = allContacts.filter(c=>(c.campaigns||[]).includes(id));
    let filtered = [...allContacts];
    let filterStatus = '', filterTag = '', searchQ = '';

    const renderTable = () => {
      let list = filtered;
      if (filterStatus) list = list.filter(c=>c.status===filterStatus);
      if (filterTag) list = list.filter(c=>(c.tags||[]).includes(filterTag));
      if (searchQ) { const q=searchQ.toLowerCase(); list=list.filter(c=>(c.nombre||'').toLowerCase().includes(q)||(c.apellido||'').toLowerCase().includes(q)||(c.razon_social||'').toLowerCase().includes(q)); }
      document.getElementById('camp-picker').innerHTML = list.map(c=>`
        <label style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px">
          <input type="checkbox" value="${c.id}" ${(c.campaigns||[]).includes(id)?'checked':''} onchange="Views.toggleCampContact('${id}','${c.id}',this.checked)">
          <div style="flex:1">
            <span style="font-weight:500">${esc(c.nombre)} ${esc(c.apellido||'')}</span>
            ${c.razon_social?`<span class="text-muted text-sm"> · ${esc(c.razon_social)}</span>`:''}
          </div>
          <span class="badge badge-${c.status}">${STATUS_LABELS[c.status]||c.status}</span>
        </label>
      `).join('') || '<div class="text-muted text-sm" style="padding:12px 0">Sin resultados</div>';
    };

    document.getElementById('page-title').textContent = camp.name;
    document.getElementById('topbar-actions').innerHTML = `
      <button class="btn btn-secondary" onclick="Router.go('campaigns')">← Volver</button>
      <button class="btn btn-primary" onclick="Views.exportCampaign('${id}')">⬇ Exportar selección</button>
    `;
    document.getElementById('content').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div class="card">
          <div class="card-title mb-4">Seleccionar contactos</div>
          <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
            <input class="form-control" id="camp-search" placeholder="Buscar…" style="flex:1" oninput="Views._campSearch(this.value)">
            <select class="form-control" style="width:auto" onchange="Views._campFilter(this.value,'status')">
              <option value="">Todos</option>${['prospecto','cliente','inactivo'].map(s=>`<option value="${s}">${STATUS_LABELS[s]}</option>`).join('')}
            </select>
            <select class="form-control" style="width:auto" onchange="Views._campFilter(this.value,'tag')">
              <option value="">Etiqueta</option>${tags.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}
            </select>
          </div>
          <div id="camp-picker" style="max-height:400px;overflow-y:auto"></div>
        </div>
        <div class="card">
          <div class="card-title mb-4">Info de campaña</div>
          <div class="info-grid">
            <div class="info-field"><label>Nombre</label><div class="info-value">${esc(camp.name)}</div></div>
            <div class="info-field"><label>Estado</label><div class="info-value"><span class="badge badge-${camp.status||'prospecto'}">${camp.status||'borrador'}</span></div></div>
            <div class="info-field"><label>Creada</label><div class="info-value">${fmtDate(camp.createdAt)}</div></div>
            <div class="info-field"><label>Ejecución</label><div class="info-value">${fmtDate(camp.execDate)}</div></div>
          </div>
          ${camp.description?`<div class="divider"></div><div class="text-muted text-sm">${esc(camp.description)}</div>`:''}
          <div class="divider"></div>
          <div id="camp-stats" style="font-size:13.5px">
            Contactos seleccionados: <strong>${campContacts.length}</strong>
          </div>
        </div>
      </div>
    `;

    Views._campSearch = v => { searchQ=v; renderTable(); };
    Views._campFilter = (v,key) => { if(key==='status') filterStatus=v; else filterTag=v; renderTable(); };
    Views.toggleCampContact = async (campId, contactId, checked) => {
      const c = await Data.getContact(contactId);
      c.campaigns = c.campaigns||[];
      if (checked) { if (!c.campaigns.includes(campId)) c.campaigns.push(campId); }
      else { c.campaigns = c.campaigns.filter(x=>x!==campId); }
      await Data.saveContact(c);
      if (checked) Audit.log('campaign_exec', 'campaigns', campId, { contactId, contactName: c.nombre }).catch(()=>{});
      campContacts = (await Data.getContacts()).filter(c2=>(c2.campaigns||[]).includes(campId));
      document.getElementById('camp-stats').innerHTML = `Contactos seleccionados: <strong>${campContacts.length}</strong>`;
    };
    renderTable();

  // ── CALENDAR / TASKS ──
  async calendar() {
    document.getElementById('page-title').textContent = 'Calendario & Tareas';
    document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="Views.showTaskModal()">+ Nueva tarea</button>`;

    let date = new Date();
    let filterAgent = CONFIG.CURRENT_USER?.id || '';

    const renderCal = async () => {
      const tasks = await Data.getTasks(filterAgent ? { assignedTo: filterAgent } : {});
      const year = date.getFullYear(), month = date.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const today = new Date().toISOString().split('T')[0];
      const monthName = date.toLocaleString('es-AR', { month: 'long', year: 'numeric' });

      const tasksByDay = {};
      tasks.forEach(t => {
        const d = t.dueDate?.split('T')[0];
        if (d) { tasksByDay[d] = tasksByDay[d]||[]; tasksByDay[d].push(t); }
      });

      const days = [];
      // Pad start
      for (let i=0; i<(firstDay===0?6:firstDay-1); i++) days.push(null);
      for (let d=1; d<=daysInMonth; d++) days.push(d);

      const pendingTasks = tasks.filter(t=>t.status!=='completada').slice(0,20);

      document.getElementById('content').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">
          <div>
            <div class="cal-nav">
              <button class="btn btn-ghost btn-icon" onclick="Views._calNav(-1)">‹</button>
              <h3>${monthName.charAt(0).toUpperCase()+monthName.slice(1)}</h3>
              <button class="btn btn-ghost btn-icon" onclick="Views._calNav(1)">›</button>
              <button class="btn btn-secondary btn-sm" onclick="Views._calToday()">Hoy</button>
              <select class="form-control" style="width:auto;margin-left:auto" id="agent-filter" onchange="Views._calAgent(this.value)">
                <option value="">Todos los agentes</option>
                ${(await Data.getUsers()).map(u=>`<option value="${u.id}" ${u.id===filterAgent?'selected':''}>${esc(u.name)}</option>`).join('')}
              </select>
            </div>
            <div class="calendar-grid">
              ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-header">${d}</div>`).join('')}
              ${days.map(d=>{
                if (!d) return '<div></div>';
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayTasks = tasksByDay[dateStr]||[];
                const visible = dayTasks.slice(0,3);
                const extra = dayTasks.length - visible.length;
                return `<div class="cal-day${dateStr===today?' today':''}" onclick="Views._calSelectDay('${dateStr}')">
                  <div class="day-num">${d}</div>
                  ${visible.map(t => {
                    const priClass = t.status==='completada' ? 'done' : `pri-${t.priority||'normal'}`;
                    return `<div class="cal-task-card ${priClass}" title="${esc(t.title)}">${esc(t.title)}</div>`;
                  }).join('')}
                  ${extra>0 ? `<div class="cal-more">+${extra} más</div>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>

          <div>
            <div class="card" style="margin-bottom:16px">
              <div class="card-header">
                <span class="card-title">Tareas pendientes</span>
              </div>
              ${pendingTasks.length ? pendingTasks.map(t=>`
                <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
                  <span class="badge badge-${t.status}" style="margin-top:2px;flex-shrink:0">${t.status.replace('_',' ')}</span>
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:500;font-size:13px">${esc(t.title)}</div>
                    <div class="text-muted text-sm">${fmtDate(t.dueDate)} ${t.priority==='alta'?'🔴':t.priority==='normal'?'🟡':''}</div>
                  </div>
                  <button class="btn btn-ghost btn-sm" onclick="Views.markTaskDone('${t.id}')" title="Completar">✓</button>
                </div>
              `).join('') : '<div class="text-muted text-sm">No hay tareas pendientes.</div>'}
            </div>
          </div>
        </div>
        <div id="day-detail"></div>
      `;

      Views._calNav = diff => { date = new Date(year, month+diff, 1); renderCal(); };
      Views._calToday = () => { date = new Date(); renderCal(); };
      Views._calAgent = v => { filterAgent=v; renderCal(); };
      Views._calSelectDay = async dayStr => {
        const dayTasks = (await Data.getTasks(filterAgent?{assignedTo:filterAgent}:{})).filter(t=>t.dueDate?.startsWith(dayStr));
        document.getElementById('day-detail').innerHTML = `
          <div class="card" style="margin-top:16px">
            <div class="card-header"><span class="card-title">Tareas del ${fmtDate(dayStr)}</span></div>
            ${dayTasks.length ? dayTasks.map(t=>`
              <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
                <span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span>
                <span style="font-size:13.5px;flex:1">${esc(t.title)}</span>
                <button class="btn btn-ghost btn-sm" onclick="Views.markTaskDone('${t.id}')">✓ Completar</button>
              </div>`).join('')
            : '<div class="text-muted text-sm">No hay tareas para este día.</div>'}
          </div>`;
      };
    };

    renderCal();
    Views.markTaskDone = async id => {
      const t = await DB.get('tasks', id);
      if (t) { t.status='completada'; t.completedAt=now(); await Data.saveTask(t); }
      renderCal();
      Toast.success('Tarea completada');
    };
  },

  async testGasConnection() {
    const url = (document.getElementById('gas-url')?.value.trim()) || CONFIG.GAS_URL;
    if (!url) { Toast.error('Ingresá la URL primero'); return; }

    if (location.protocol === 'file:') {
      this._showConnectionDiagnostic(url, 'file_protocol');
      return;
    }
    if (url.includes('/dev')) {
      this._showConnectionDiagnostic(url, 'dev_url');
      return;
    }
    if (!url.includes('/exec')) {
      Toast.error('La URL debe terminar en /exec');
      return;
    }

    // GAS tiene un problema de CORS con fetch() por sus redirecciones internas.
    // La forma más confiable de verificar es abrir la URL en una pestaña nueva.
    Modal.open('Verificar conexión', `
      <div style="padding:4px 0">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px">📋 Verificación manual</div>
        <div style="font-size:13px;color:var(--text-2);line-height:1.7;margin-bottom:14px">
          Google Apps Script tiene restricciones de CORS que impiden verificar la conexión
          automáticamente desde el navegador. Para confirmar que tu servidor funciona:
        </div>
        <div style="background:var(--bg);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);margin-bottom:14px">
          <div style="font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:8px">Paso 1 — Abrí esta URL en una pestaña nueva:</div>
          <a href="${url}?action=ping" target="_blank"
             style="display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;padding:7px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;text-decoration:none">
            🔗 Abrir URL del servidor →
          </a>
        </div>
        <div style="background:var(--bg);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);margin-bottom:14px">
          <div style="font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px">Paso 2 — Si ves esto, el servidor está bien:</div>
          <code style="background:#0f172a;color:#4ade80;padding:8px 12px;border-radius:6px;display:block;font-size:12px">{"ok":true,"ts":"2026-..."}</code>
        </div>
        <div style="font-size:12.5px;color:var(--text-2);line-height:1.6">
          ✅ Si ves el JSON → el servidor está OK, podés sincronizar normalmente.<br>
          ❌ Si ves error de Google → revisá permisos de la implementación.
        </div>
      </div>
    `, `<button class="btn btn-primary" onclick="Modal.close()">Entendido</button>`);
  },

  _showConnectionDiagnostic(url, type, detail) {
    const causes = {
      file_protocol: {
        title: '⚠️ Archivo abierto localmente (file://)',
        msg: `El navegador bloquea todas las conexiones externas cuando abrís el archivo con doble click.<br><br>
          <strong>Soluciones:</strong><br>
          1. Subí el archivo a un hosting (Netlify, GitHub Pages)<br>
          2. Usá un servidor local: abrí una terminal en la carpeta del archivo y ejecutá:<br>

      },

        title: '⚠️ URL incorrecta (/dev en lugar de /exec)',
        msg: `La URL que pegaste contiene <code>/dev</code> — esa URL requiere que hayas iniciado sesión en Google y no funciona para uso general.<br><br>
          <strong>Solución:</strong> En Apps Script → Implementar → Administrar implementaciones, copiá la URL que termina en <code>/exec</code>`,
      },
      http_error: {
        title: `❌ Error HTTP ${detail}`,
        msg: `El servidor respondió con código ${detail}.<br><br>
          <strong>Posibles causas:</strong><br>
          • La implementación fue borrada o expiró<br>
          • El acceso no está configurado como "Cualquiera"<br><br>
          <strong>Solución:</strong> Hacé una nueva implementación en Apps Script.`,
      },
      not_json: {
        title: '⚠️ Respuesta inesperada del servidor',
        msg: `El servidor respondió pero no es JSON válido. Puede que Apps Script esté mostrando un error interno.<br><br>
          <strong>Respuesta recibida:</strong><br>
          <code style="font-size:11px;word-break:break-all">${detail}</code><br><br>
          Revisá los logs en Apps Script → Ejecuciones.`,
      },
      fetch_error: {
        title: '❌ No se pudo conectar al servidor',
        msg: `Error: <code>${detail}</code><br><br>
          <strong>Checklist:</strong><br>
          ✓ ¿La URL termina en <code>/exec</code>?<br>
          ✓ ¿La implementación está publicada como "Cualquiera puede acceder"?<br>
          ✓ ¿Tenés conexión a internet?<br>
          ✓ ¿El archivo está en un servidor (no abierto con file://)?<br><br>
          <strong>Para verificar manualmente:</strong><br>
          <a href="${url}?action=ping" target="_blank" style="color:var(--accent)">Abrí este link en una nueva pestaña →</a>`,
      },
    };

    const info = causes[type] || { title: 'Error de conexión', msg: detail };

    Modal.open('Diagnóstico de conexión', `
      <div style="padding:4px 0">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px">${info.title}</div>
        <div style="font-size:13px;color:var(--text-2);line-height:1.7">${info.msg}</div>
        ${type === 'fetch_error' || type === 'not_json' ? `
          <div style="margin-top:16px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border)">
            <div style="font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:4px">URL configurada:</div>
            <div style="font-size:11px;word-break:break-all;color:var(--text-3)">${url}</div>
          </div>` : ''}
      </div>
    `, `<button class="btn btn-primary" onclick="Modal.close()">Entendido</button>`);
  },

  downloadImportTemplate() {
    const header = 'nombre,apellido,razon_social,email,telefono,cuit,ciudad,status,condicion,tags';
    const example = 'Juan,Pérez,Empresa SA,juan@empresa.com,1155443322,20-12345678-9,Buenos Aires,prospecto,Monotributista,VIP|potencial';
    const blob = new Blob([header + '\n' + example + '\n'], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'template_contactos.csv'; a.click();
    URL.revokeObjectURL(url);
    Toast.success('Template descargado');
  },

  handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const { headers, rows } = Importer.parseCSV(e.target.result);
        Views._importData = { headers, rows, mapping: Importer.autoMap(headers), file };
        Views.showImportMapping();
      } catch(err) { Toast.error('Error al leer el CSV: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
  },

  showImportMapping() {
    const { headers, rows, mapping, file } = Views._importData;
    document.getElementById('import-step-1').classList.add('hidden');
    document.getElementById('import-step-3').classList.add('hidden');
    document.getElementById('import-step-4').classList.add('hidden');
    document.getElementById('import-step-2').classList.remove('hidden');
    document.getElementById('import-file-info').textContent = `${file.name} · ${rows.length} filas`;

    const autoDetected = Importer.autoMap(headers);
    document.getElementById('col-map-table').innerHTML = `
      <table style="width:100%;border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left;padding:8px;border-bottom:2px solid var(--border);font-size:11.5px;color:var(--text-2);text-transform:uppercase">Columna CSV</th>
          <th style="text-align:left;padding:8px;border-bottom:2px solid var(--border);font-size:11.5px;color:var(--text-2);text-transform:uppercase">Muestra</th>
          <th style="text-align:left;padding:8px;border-bottom:2px solid var(--border);font-size:11.5px;color:var(--text-2);text-transform:uppercase">Campo en SynclickCRM</th>
        </tr></thead>
        <tbody>${headers.map(h => {
          const sample = rows.slice(0,3).map(r=>r[h]).filter(Boolean).join(', ');
          const isAuto = autoDetected[h] !== '_skip';
          return `<tr>
            <td style="padding:8px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px">${esc(h)} ${isAuto?'<span title="Detectado automáticamente" style="color:var(--accent)">⚡</span>':''}</td>
            <td style="padding:8px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sample)}</td>
            <td style="padding:8px;border-bottom:1px solid var(--border)">
              <select class="col-map-select" data-col="${esc(h)}" onchange="Views._importData.mapping['${esc(h)}']=this.value">
                ${Importer.CONTACT_FIELDS.map(f=>`<option value="${f.key}" ${mapping[h]===f.key?'selected':''}>${f.label}</option>`).join('')}
              </select>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    `;
  },

  showImportPreview() {
    const { rows, mapping } = Views._importData;
    document.getElementById('import-step-2').classList.add('hidden');
    document.getElementById('import-step-3').classList.remove('hidden');

    const hasNombre = Object.values(mapping).includes('nombre');
    if (!hasNombre) return Toast.error('Debés mapear al menos la columna "Nombre"');

    const preview = rows.slice(0, 50);
    let ok = 0, warn = 0, err = 0;
    const fields = Importer.CONTACT_FIELDS.filter(f => f.key !== '_skip' && Object.values(mapping).includes(f.key));

    document.getElementById('import-preview-count').textContent = `Mostrando ${preview.length} de ${rows.length} filas`;
    document.getElementById('import-preview-table').innerHTML = `
      <table style="width:100%;border-collapse:collapse">
        <thead><tr>
          <th style="padding:6px 8px;border-bottom:2px solid var(--border);font-size:11px;color:var(--text-2);text-transform:uppercase">Estado</th>
          ${fields.map(f=>`<th style="padding:6px 8px;border-bottom:2px solid var(--border);font-size:11px;color:var(--text-2);text-transform:uppercase">${f.label}</th>`).join('')}
        </tr></thead>
        <tbody>${preview.map(row => {
          const { contact, warnings, valid } = Importer.transformRow(row, mapping);
          if (!valid) err++;
          else if (warnings.length) warn++;
          else ok++;
          const cls = !valid ? 'row-err' : warnings.length ? 'row-warn' : 'row-ok';
          const icon = !valid ? '❌' : warnings.length ? '⚠️' : '✅';
          return `<tr class="import-row-preview ${cls}">
            <td style="padding:5px 8px;text-align:center">${icon}</td>
            ${fields.map(f=>`<td style="padding:5px 8px;font-size:12px;white-space:nowrap;overflow:hidden;max-width:150px;text-overflow:ellipsis">${esc(contact[f.key]||'')}</td>`).join('')}
          </tr>`;
        }).join('')}</tbody>
      </table>
    `;

    document.getElementById('import-execute-btn').textContent = `⬆ Importar ${rows.length} contactos`;
    document.getElementById('import-progress-text').textContent = `✅ ${ok} ok · ⚠️ ${warn} con advertencias · ❌ ${err} sin nombre (se omitirán)`;
  },

  async executeImport() {
    const { rows, mapping } = Views._importData;
    document.getElementById('import-execute-btn').disabled = true;
    document.getElementById('import-pbar').classList.remove('hidden');
    const fill = document.getElementById('import-pfill');
    const text = document.getElementById('import-progress-text');

    const result = await Importer.importBatch(rows, mapping, (done, total, ok, skipped, errors) => {
      const pct = Math.round((done / total) * 100);
      fill.style.width = pct + '%';
      text.textContent = `${done}/${total} · ✅ ${ok} importados · ⏭ ${skipped} omitidos · ❌ ${errors} errores`;
    });

    document.getElementById('import-step-3').classList.add('hidden');
    document.getElementById('import-step-4').classList.remove('hidden');
    document.getElementById('import-result-detail').innerHTML =
      `<strong style="color:var(--success);font-size:16px">${result.ok} contactos importados</strong><br>
       ${result.skipped ? `${result.skipped} filas omitidas (sin nombre)` : ''}
       ${result.errors ? ` · ${result.errors} errores` : ''}`;
    Toast.success(`Importación completa: ${result.ok} contactos`);
  },

  resetImport() {
    Views._importData = null;
    Views.import();
  },

            <div style="display:flex;justify-content:space-between;font-size:13px">
              <span class="text-muted">Total contactos</span>
              <span style="font-weight:700;font-family:var(--font-head);font-size:16px">${contacts.length}</span>
            </div>
          </div>

          <div class="card">
            <div class="card-title mb-4">📋 Campañas</div>
            ${stats.campStats.length ? stats.campStats.slice(0,6).map(c => `
              <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
                <span class="badge badge-${c.status==='activa'?'cliente':c.status==='cerrada'?'inactivo':'prospecto'}" style="flex-shrink:0">${c.status||'borrador'}</span>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</div>
                  <div class="text-muted text-sm">${c.contactCount} contactos · ${c.executions} exec.</div>
                </div>
              </div>
            `).join('') : '<div class="text-muted text-sm">Sin campañas creadas.</div>'}
            <div class="divider"></div>
            <div style="display:flex;justify-content:space-between;font-size:13px">
              <span class="text-muted">Tareas completadas</span>
              <span style="font-weight:700">${tasks.filter(t=>t.status==='completada').length} / ${tasks.length}</span>
            </div>
          </div>
        </div>

        <!-- Audit Log -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">📜 Registro de actividad</span>
            <div style="display:flex;gap:8px;align-items:center">
              <select class="form-control" style="width:auto;font-size:12.5px" id="audit-filter-user" onchange="Views._analyticsFilterAudit()">
                <option value="">Todos los agentes</option>
                ${(await DB.getAll('users')).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}
              </select>
              <select class="form-control" style="width:auto;font-size:12.5px" id="audit-filter-action" onchange="Views._analyticsFilterAudit()">
                <option value="">Todas las acciones</option>
                ${['create','update','delete','campaign_create','campaign_exec','import','login'].map(a=>`<option value="${a}">${a.replace('_',' ')}</option>`).join('')}
              </select>
            </div>
          </div>
          <div id="audit-log-list">
            ${Views._renderAuditList(stats.allEntries.slice(0,50))}
          </div>
          ${stats.allEntries.length > 50 ? `<div class="text-muted text-sm" style="text-align:center;padding:10px">Mostrando 50 de ${stats.allEntries.length} registros</div>` : ''}
        </div>
      `;

      // Wire up filter + day handlers
      Views._analyticsSetDays = async d => { days = d; await render(); };
      Views._analyticsFilterAudit = async () => {
        const userId = document.getElementById('audit-filter-user')?.value || '';
        const action = document.getElementById('audit-filter-action')?.value || '';
        const filtered = await Audit.getAll({ days, userId, action });
        document.getElementById('audit-log-list').innerHTML = Views._renderAuditList(filtered.slice(0,80));
      };
      Views._showChartTip = (e, date, count) => {
        const tip = document.getElementById('chart-tip');
        tip.textContent = `${date}: ${count} acciones`;
        tip.style.left = (e.offsetX + 10) + 'px';
        tip.style.top = (e.offsetY - 30) + 'px';
        tip.classList.add('visible');
      };
      Views._hideChartTip = () => document.getElementById('chart-tip')?.classList.remove('visible');
    };

    await render();
  },

  _renderAuditList(entries) {
    if (!entries.length) return '<div class="empty-state"><div class="empty-icon">📋</div><p>Sin registros para el período seleccionado.</p></div>';
    const typeClass = { create:'audit-create', update:'audit-update', delete:'audit-delete', campaign_exec:'audit-campaign', campaign_create:'audit-campaign', import:'audit-import', login:'audit-login', logout:'audit-login' };
    const icons = Audit.ICONS;
    return entries.map(e => {
      let detail = '';
      try { const d = JSON.parse(e.detail||'{}'); detail = d.nombre ? `${d.nombre} ${d.apellido||''}` : d.name || d.username || ''; } catch {}
      return `<div class="audit-row">
        <div class="audit-icon ${typeClass[e.action]||'audit-update'}">${icons[e.action]||'•'}</div>
        <div class="audit-detail">
          <div class="audit-title">${esc(e.userName)} — <span style="color:var(--text-2)">${e.action.replace('_',' ')}</span> ${detail?`<span style="color:var(--text-3)">· ${esc(detail)}</span>`:''}</div>
          <div class="audit-meta">${fmtDatetime(e.ts)} · ${e.entity}</div>
        </div>
      </div>`;
    }).join('');
  },

  async clearLocalData() {
    if (!confirm('¿Seguro que querés borrar todos los datos locales? Se perderán cambios no sincronizados.')) return;
    indexedDB.deleteDatabase('synclickcrm_v2');
    localStorage.clear();
    Toast.info('Datos borrados. Recargando…');
    setTimeout(() => location.reload(), 1500);
  },
};

// ════════════════════════════════════════════
// ROUTER
// ════════════════════════════════════════════
const Router = {
  routes: {
    dashboard: Views.dashboard,
    contacts: Views.contacts,
    contact: Views.contact,
    campaigns: (p) => p?.id ? Views.campaignDetail(p.id) : Views.campaigns(),
    calendar: Views.calendar,
    exports: Views.exports,
    import: Views.import,
    analytics: Views.analytics,
    conflicts: Views.conflicts,
    users: Views.users,
    settings: Views.settings,
  },

  go(view, params) {
    const hash = params?.id ? `#${view}/${params.id}` : `#${view}`;
    try {
      history.pushState({ view, params }, '', hash);
    } catch(e) {
      // Fallback for restricted iframe environments (e.g. about:srcdoc)
      location.hash = hash;
    }
    this.render(view, params);
  },

  render(view, params) {
    const hash = location.hash.slice(1);
    const [v, id] = hash.split('/');
    const activeView = view || v || 'dashboard';
    const activeParams = params || (id ? { id } : {});

    document.querySelectorAll('.nav-item').forEach(el => {
      const elView = el.getAttribute('data-view');
      el.classList.toggle('active', elView === activeView || (activeView === 'contact' && elView === 'contacts') || (activeView === 'campaigns' && elView === 'campaigns' && !id));
    });

    const fn = this.routes[activeView];
    if (fn) fn.call(Views, activeParams);
  }
};

window.addEventListener('popstate', () => Router.render());
window.addEventListener('hashchange', () => Router.render());
document.querySelectorAll('.nav-item[data-view]').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    Router.go(el.getAttribute('data-view'));
  });
});

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
async function init() {
  await DB.open();

  const hasSession = Auth.checkSession();

  if (hasSession) {
    const ls = document.getElementById('login-screen');
    ls.style.display = 'none';
    await Sync.init();
    Router.render();
  } else {
    Sync.init();
  }
}



init();
</script>
